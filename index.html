<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Красная Книга: Пазл</title>
<style>
:root{
  --paper:#F6F1E4;
  --paper-dark:#EDE4CC;
  --ink:#26301F;
  --forest:#1B4332;
  --moss:#2E6F40;
  --gold:#B8860B;
  --clay:#B3452A;
  --card:#FFFDF7;
  --shadow: 0 6px 18px rgba(27,67,50,0.18);
}
*{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
html,body{height:100%;}
body{
  margin:0;
  font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  background:
    radial-gradient(circle at 20% 10%, rgba(46,111,64,0.06), transparent 40%),
    radial-gradient(circle at 90% 80%, rgba(184,134,11,0.08), transparent 45%),
    var(--paper);
  color:var(--ink);
  overflow:hidden;
  user-select:none;
}
#app{position:relative; width:100%; height:100%;}
.screen{
  position:absolute; inset:0;
  display:none;
  flex-direction:column;
  padding: max(16px, env(safe-area-inset-top)) 16px 16px;
  overflow-y:auto;
}
.screen.active{display:flex;}

h1,h2,h3{font-family: Georgia, "Times New Roman", serif; margin:0; color:var(--forest);}

/* ---------- MENU ---------- */
#screen-menu{align-items:center; justify-content:center; text-align:center; gap:6px;}
.brand-mark{
  width:86px; height:86px; margin-bottom:10px;
  border-radius:50%;
  background: var(--forest);
  display:flex; align-items:center; justify-content:center;
  box-shadow: var(--shadow);
  border: 3px solid var(--gold);
}
.brand-mark svg{width:52px; height:52px;}
#screen-menu h1{font-size:28px; letter-spacing:0.5px;}
#screen-menu .tagline{color:#5b6b52; font-size:14px; margin-top:2px; margin-bottom:22px; max-width:280px;}
.btn{
  font-family: inherit;
  font-size:16px;
  font-weight:600;
  padding:14px 30px;
  border-radius:12px;
  border:none;
  cursor:pointer;
  box-shadow: var(--shadow);
  transition: transform .12s ease;
}
.btn:active{transform: scale(0.96);}
.btn-primary{background:var(--moss); color:#fff;}
.btn-secondary{background:var(--card); color:var(--forest); border:2px solid var(--moss);}
.btn-gold{background:var(--gold); color:#fff;}
.menu-stack{display:flex; flex-direction:column; gap:12px; width:220px;}

/* ---------- TOPBAR ---------- */
.topbar{
  display:flex; align-items:center; gap:10px;
  margin-bottom:10px; flex-wrap:wrap;
}
.icon-btn{
  width:40px; height:40px; border-radius:10px;
  background:var(--card); border:2px solid var(--paper-dark);
  display:flex; align-items:center; justify-content:center;
  font-size:18px; cursor:pointer; color:var(--forest); flex-shrink:0;
}
.topbar h2{flex:1; font-size:18px; min-width:100px;}

/* ---------- LEVEL SELECT ---------- */
.level-list{display:flex; flex-direction:column; gap:14px; padding-bottom:20px;}
.level-card{
  background:var(--card);
  border-radius:16px;
  padding:14px;
  display:flex; gap:12px; align-items:center;
  box-shadow: var(--shadow);
  border:1px solid var(--paper-dark);
  cursor:pointer;
  position:relative;
}
.level-thumb{
  width:64px; height:64px; border-radius:10px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  background:var(--paper-dark);
}
.level-thumb svg{width:100%; height:100%;}
.level-info{flex:1; min-width:0;}
.level-info .name{font-weight:700; color:var(--forest); font-size:16px;}
.level-info .meta{font-size:12px; color:#6b7a63; margin-top:3px;}
.level-info .diff-pill{
  display:inline-block; margin-top:6px; font-size:11px; padding:2px 9px;
  border-radius:20px; background:var(--paper-dark); color:var(--moss); font-weight:600;
}
.level-card.done::after{
  content:"✓ Собрано";
  position:absolute; top:10px; right:12px;
  font-size:11px; font-weight:700; color:var(--gold);
}

/* ---------- COLLECTION ---------- */
.collection-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
.collection-item{
  aspect-ratio:1/1; border-radius:12px; background:var(--card);
  display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow);
  border:1px solid var(--paper-dark);
}
.collection-item.locked{opacity:0.35;}
.collection-item svg{width:70%; height:70%;}

/* ---------- GAME SCREEN ---------- */
#screen-game{padding-bottom:0;}
.mode-toggle{
  display:flex; background:var(--paper-dark); border-radius:20px; padding:3px; flex-shrink:0;
}
.mode-toggle button{
  border:none; background:transparent; padding:7px 13px; border-radius:16px;
  font-size:12px; font-weight:700; color:var(--forest); cursor:pointer;
}
.mode-toggle button.active{background:var(--moss); color:#fff;}

.progress-wrap{
  height:8px; background:var(--paper-dark); border-radius:6px; overflow:hidden; margin-bottom:10px; flex-shrink:0;
}
.progress-bar{height:100%; width:0%; background:linear-gradient(90deg,var(--moss),var(--gold)); transition:width .25s ease;}

.hint-row{display:flex; gap:8px; justify-content:center; margin-bottom:10px; flex-wrap:wrap; flex-shrink:0;}
.hint-row .btn{padding:9px 16px; font-size:12.5px;}

.board-wrap{flex:1; display:flex; align-items:center; justify-content:center; min-height:0; position:relative;}

.board-outer{
  position:relative;
  padding: 30px 34px;
}
#board{
  position:relative;
  background:var(--forest);
  border-radius:10px;
  box-shadow: var(--shadow);
  overflow:hidden;
  touch-action:none;
}
.tile{
  position:absolute;
  border:1px solid rgba(255,255,255,0.25);
  background-color:var(--card);
  background-repeat:no-repeat;
  transition: left .22s ease, top .22s ease;
  display:flex; align-items:center; justify-content:center;
  overflow:hidden;
  cursor:grab;
}
.tile.text-mode{
  padding:3px;
  font-size:10.5px;
  line-height:1.15;
  text-align:center;
  color:var(--ink);
  background-color:var(--card);
  font-weight:600;
}
.tile-number{
  position:absolute; top:2px; left:2px;
  background:var(--gold); color:#fff; font-size:9px; font-weight:800;
  border-radius:50%; width:16px; height:16px;
  display:flex; align-items:center; justify-content:center;
  opacity:0; transition:opacity .2s ease; pointer-events:none;
}
#board.show-hints .tile-number{opacity:1;}

/* row/column shift arrows */
.row-arrow, .col-arrow{
  position:absolute;
  background:var(--card);
  border:2px solid var(--moss);
  color:var(--forest);
  border-radius:50%;
  width:24px; height:24px;
  display:flex; align-items:center; justify-content:center;
  font-size:12px; font-weight:800;
  cursor:pointer;
  box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  z-index:5;
}
.row-arrow:active, .col-arrow:active{transform:scale(0.9);}

.peek-overlay{
  position:absolute; inset:0; z-index:50;
  background:rgba(27,48,31,0.55);
  display:none; align-items:center; justify-content:center;
  border-radius:10px;
}
.peek-overlay.active{display:flex;}
.peek-overlay .peek-art{width:78%; aspect-ratio:1/1; border-radius:10px; overflow:hidden; box-shadow:0 10px 30px rgba(0,0,0,0.4); border:4px solid var(--gold);}
.peek-overlay .peek-art svg{width:100%; height:100%; display:block;}
.peek-hint-text{position:absolute; bottom:8px; color:#fff; font-size:11px; text-align:center; width:100%;}

/* ---------- RESULT MODAL ---------- */
.modal-overlay{
  position:fixed; inset:0; background:rgba(27,48,31,0.55);
  display:none; align-items:center; justify-content:center; z-index:500; padding:20px;
}
.modal-overlay.active{display:flex;}
.modal{
  background:var(--card); border-radius:18px; max-width:380px; width:100%;
  max-height:88vh; overflow-y:auto; padding:20px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.35);
  border-top: 6px solid var(--gold);
  position:relative;
}
.modal .full-art{
  width:100%; aspect-ratio:1/1; border-radius:12px; overflow:hidden; margin-bottom:14px;
  box-shadow: inset 0 0 0 4px var(--gold);
}
.modal .full-art svg{width:100%; height:100%; display:block;}
.status-badge{
  display:inline-block; background:var(--clay); color:#fff; font-size:11px; font-weight:700;
  padding:4px 10px; border-radius:20px; margin:6px 0 10px;
}
.modal .latin{font-style:italic; color:#7a8571; font-size:13px; margin-bottom:10px;}
.fact-list{list-style:none; padding:0; margin:0 0 16px; display:flex; flex-direction:column; gap:8px;}
.fact-list li{font-size:13.5px; padding-left:18px; position:relative; line-height:1.4;}
.fact-list li::before{content:"🌿"; position:absolute; left:-2px; top:0; font-size:11px;}
.modal-actions{display:flex; flex-direction:column; gap:9px;}
.modal-actions .btn{width:100%;}

/* toast */
#toast{
  position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px);
  background:var(--forest); color:#fff; padding:10px 18px; border-radius:20px;
  font-size:13px; opacity:0; transition:all .25s ease; z-index:900; pointer-events:none;
  box-shadow:var(--shadow);
}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div id="app">

  <!-- ===================== MENU ===================== -->
  <div class="screen active" id="screen-menu">
    <div class="brand-mark">
      <svg viewBox="0 0 64 64"><path d="M32 6C22 14 12 20 8 30c-3 8 1 18 10 22 5 2 9 0 14-4 5 4 9 6 14 4 9-4 13-14 10-22C52 20 42 14 32 6Z" fill="#F6F1E4"/><path d="M32 16c3 8 3 16 0 24" stroke="#B8860B" stroke-width="2" fill="none"/></svg>
    </div>
    <h1>Красная Книга: Пазл</h1>
    <p class="tagline">Сдвигайте ряды и столбцы, чтобы собрать редких животных</p>
    <div class="menu-stack">
      <button class="btn btn-primary" onclick="App.goTo('levels')">Играть</button>
      <button class="btn btn-secondary" onclick="App.openCollection()">Коллекция</button>
    </div>
  </div>

  <!-- ===================== LEVEL SELECT ===================== -->
  <div class="screen" id="screen-levels">
    <div class="topbar">
      <div class="icon-btn" onclick="App.goTo('menu')">←</div>
      <h2>Выберите пазл</h2>
    </div>
    <div class="level-list" id="level-list"></div>
  </div>

  <!-- ===================== COLLECTION ===================== -->
  <div class="screen" id="screen-collection">
    <div class="topbar">
      <div class="icon-btn" onclick="App.goTo('menu')">←</div>
      <h2>Моя коллекция</h2>
    </div>
    <div class="collection-grid" id="collection-grid"></div>
  </div>

  <!-- ===================== GAME ===================== -->
  <div class="screen" id="screen-game">
    <div class="topbar">
      <div class="icon-btn" onclick="Game.exit()">←</div>
      <h2 id="game-title">Животное</h2>
      <div class="mode-toggle">
        <button id="mode-pic-btn" class="active" onclick="Game.setMode('picture')">Картинка</button>
        <button id="mode-text-btn" onclick="Game.setMode('text')">Текст</button>
      </div>
    </div>
    <div class="progress-wrap"><div class="progress-bar" id="progress-bar"></div></div>

    <div class="hint-row">
      <button class="btn btn-secondary" onclick="Game.peek()">👁 Показать целиком</button>
      <button class="btn btn-gold" onclick="Game.useHint()">💡 Подсказка (реклама)</button>
    </div>

    <div class="board-wrap">
      <div class="board-outer" id="board-outer">
        <div id="board"></div>
        <div class="peek-overlay" id="peek-overlay" onclick="Game.closePeek()">
          <div class="peek-art" id="peek-art"></div>
          <div class="peek-hint-text">Нажмите, чтобы закрыть</div>
        </div>
      </div>
    </div>
  </div>

</div>

<!-- ===================== RESULT MODAL ===================== -->
<div class="modal-overlay" id="modal-result">
  <div class="modal">
    <div class="full-art" id="modal-art"></div>
    <h2 id="modal-name">Название</h2>
    <div class="latin" id="modal-latin">Latinus nomen</div>
    <div class="status-badge" id="modal-status">Статус</div>
    <ul class="fact-list" id="modal-facts"></ul>
    <div class="modal-actions">
      <button class="btn btn-primary" id="modal-next-btn" onclick="Game.next()">Следующий пазл</button>
      <button class="btn btn-secondary" onclick="Game.share()">Поделиться</button>
      <button class="btn btn-secondary" onclick="App.goTo('menu'); Modal.close();">На главную</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
/* =========================================================================
   КРАСНАЯ КНИГА: ПАЗЛ — прототип игровой логики
   Механика — как в Art of Fauna: сдвиг рядов/столбцов (loopover), доска
   переворачивается между картинкой и текстом с общим прогрессом.
   Готов для встраивания в VK Mini App / VK Play (HTML5).
   Для реального деплоя на VK:
     1) Подключить SDK:  script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"
     2) Вызвать vkBridge.send('VKWebAppInit') при старте (см. VK.init ниже).
     3) Настроить манифест мини-приложения в кабинете VK Play.
     4) Заменить SVG-плейсхолдеры на финальные PNG/JPG ассеты (1024×1024).
   ========================================================================= */

/* ---------------------- VK BRIDGE WRAPPER ---------------------- */
const VK = {
  bridge: (typeof window !== "undefined" && window.vkBridge) ? window.vkBridge : null,
  ready:false,
  init(){
    if(this.bridge){
      this.bridge.send('VKWebAppInit').then(()=>{ this.ready = true; }).catch(()=>{});
    }
  },
  showRewardedAd(onSuccess){
    if(this.bridge){
      this.bridge.send('VKWebAppShowNativeAds', { ad_format: 'reward' })
        .then((data)=>{ if(data && data.result){ onSuccess(); } })
        .catch(()=>{ toast('Реклама недоступна'); });
    } else {
      if(confirm('[Заглушка] Показать рекламу за подсказку?')) onSuccess();
    }
  },
  shareResult(text){
    if(this.bridge){
      this.bridge.send('VKWebAppShare', { link: 'https://vk.com/app/red_book_puzzle' }).catch(()=>{});
    } else {
      toast('Поделиться: ' + text);
    }
  },
  saveProgress(key, value){
    try{ localStorage.setItem(key, JSON.stringify(value)); }catch(e){}
  },
  loadProgress(key, fallback){
    try{
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    }catch(e){ return fallback; }
  }
};

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._timer);
  toast._timer = setTimeout(()=>t.classList.remove('show'), 1800);
}

/* ---------------------- ОРИГИНАЛЬНЫЕ ИЛЛЮСТРАЦИИ (SVG) ---------------------- */
const ART = {
  tiger: `<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <rect width="200" height="200" fill="#E8862A"/>
    <path d="M0 140 Q100 110 200 140 V200 H0 Z" fill="#2E6F40" opacity="0.35"/>
    <ellipse cx="100" cy="120" rx="60" ry="50" fill="#F0902E"/>
    <circle cx="70" cy="70" r="30" fill="#F0902E"/>
    <circle cx="130" cy="70" r="30" fill="#F0902E"/>
    <circle cx="58" cy="60" r="9" fill="#F0902E"/>
    <circle cx="142" cy="60" r="9" fill="#F0902E"/>
    <g stroke="#26301F" stroke-width="6" fill="none" stroke-linecap="round">
      <path d="M55 55 L45 40"/><path d="M70 45 L65 28"/><path d="M90 40 L90 22"/>
      <path d="M145 55 L155 40"/><path d="M130 45 L135 28"/>
      <path d="M60 115 L40 110"/><path d="M60 130 L38 132"/>
      <path d="M140 115 L160 110"/><path d="M140 130 L162 132"/>
      <path d="M100 150 L100 168"/>
    </g>
    <circle cx="82" cy="72" r="5" fill="#26301F"/><circle cx="118" cy="72" r="5" fill="#26301F"/>
    <path d="M92 90 Q100 96 108 90" stroke="#26301F" stroke-width="4" fill="none" stroke-linecap="round"/>
  </svg>`,
  bear: `<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <rect width="200" height="200" fill="#BFE0EE"/>
    <rect y="150" width="200" height="50" fill="#EAF3EC"/>
    <ellipse cx="100" cy="120" rx="58" ry="50" fill="#FCFCFA"/>
    <circle cx="66" cy="72" r="26" fill="#FCFCFA"/>
    <circle cx="134" cy="72" r="26" fill="#FCFCFA"/>
    <circle cx="58" cy="65" r="9" fill="#F4F1E4"/><circle cx="142" cy="65" r="9" fill="#F4F1E4"/>
    <ellipse cx="100" cy="120" rx="20" ry="16" fill="#F4F1E4"/>
    <circle cx="100" cy="112" r="7" fill="#26301F"/>
    <circle cx="80" cy="100" r="4" fill="#26301F"/><circle cx="120" cy="100" r="4" fill="#26301F"/>
  </svg>`,
  crane: `<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <rect width="200" height="200" fill="#EAF3EC"/>
    <rect y="160" width="200" height="40" fill="#B7D6C4"/>
    <ellipse cx="100" cy="120" rx="34" ry="46" fill="#FFFFFF" stroke="#26301F" stroke-width="2"/>
    <path d="M100 80 Q90 40 70 20" stroke="#FFFFFF" stroke-width="14" fill="none" stroke-linecap="round"/>
    <path d="M100 80 Q90 40 70 20" stroke="#26301F" stroke-width="2" fill="none"/>
    <circle cx="70" cy="20" r="10" fill="#26301F"/>
    <path d="M60 20 L30 14" stroke="#E8862A" stroke-width="4" stroke-linecap="round"/>
    <path d="M85 150 L80 190" stroke="#E8862A" stroke-width="5" stroke-linecap="round"/>
    <path d="M115 150 L120 190" stroke="#E8862A" stroke-width="5" stroke-linecap="round"/>
    <path d="M120 110 Q150 100 170 70" stroke="#26301F" stroke-width="6" fill="none" stroke-linecap="round"/>
  </svg>`
};

function svgToDataUri(svg){
  return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
}

/* ---------------------- КОНТЕНТ ПАЗЛОВ ---------------------- */
const PUZZLES = [
  {
    id:"tiger", name:"Амурский тигр", latin:"Panthera tigris altaica",
    status:"Находится под угрозой исчезновения", grid:3, art:ART.tiger,
    facts:[
      "Самый крупный подвид тигра в мире.",
      "Обитает на Дальнем Востоке России, в Приморье и Приамурье.",
      "Взрослый тигр способен пройти за сутки до 40 км в поисках добычи.",
      "В дикой природе осталось около 500–600 особей.",
      "Занесён в Красную книгу России как вид, находящийся под угрозой исчезновения."
    ]
  },
  {
    id:"bear", name:"Белый медведь", latin:"Ursus maritimus",
    status:"Уязвимый вид", grid:4, art:ART.bear,
    facts:[
      "Крупнейший наземный хищник планеты.",
      "Живёт на арктическом побережье и дрейфующих льдах Северного Ледовитого океана.",
      "Отличный пловец — может преодолевать десятки километров вплавь.",
      "Основная угроза — сокращение площади морского льда из-за изменения климата.",
      "Занесён в Красную книгу России и Международный список охраняемых видов."
    ]
  },
  {
    id:"crane", name:"Стерх (белый журавль)", latin:"Grus leucogeranus",
    status:"Находится под угрозой исчезновения", grid:5, art:ART.crane,
    facts:[
      "Один из самых редких журавлей в мире.",
      "Гнездится в тундре Якутии и Западной Сибири.",
      "Совершает перелёт на зимовку в Китай на расстояние более 5000 км.",
      "Издаёт характерный трубный крик, который слышен за несколько километров.",
      "Символ бережного отношения к природе — программа «Полёт надежды» помогает восстановить его популяцию."
    ]
  }
];

// Разбиваем описание животного на текстовые фрагменты — по одному на каждую плитку,
// в том же порядке чтения, что и картинка (слева-направо, сверху-вниз).
function buildTextChunks(puzzle){
  const words = puzzle.facts.join(' ').split(' ').filter(Boolean);
  const total = puzzle.grid * puzzle.grid;
  const perChunk = Math.max(1, Math.ceil(words.length / total));
  const chunks = [];
  for(let i=0;i<total;i++){
    const slice = words.slice(i*perChunk, (i+1)*perChunk);
    chunks.push(slice.join(' ') || '···');
  }
  return chunks;
}

/* ---------------------- ХРАНИЛИЩЕ ПРОГРЕССА ---------------------- */
const Progress = {
  data: VK.loadProgress('rk_progress', { completed: [] }),
  isDone(id){ return this.data.completed.includes(id); },
  markDone(id){
    if(!this.isDone(id)){ this.data.completed.push(id); VK.saveProgress('rk_progress', this.data); }
  }
};

/* ---------------------- НАВИГАЦИЯ ---------------------- */
const App = {
  goTo(name){
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
    document.getElementById('screen-'+name).classList.add('active');
    if(name==='levels') App.renderLevels();
    if(name==='collection') App.renderCollection();
  },
  renderLevels(){
    const list = document.getElementById('level-list');
    list.innerHTML = '';
    PUZZLES.forEach(p=>{
      const done = Progress.isDone(p.id);
      const card = document.createElement('div');
      card.className = 'level-card' + (done ? ' done':'');
      card.onclick = ()=>Game.start(p.id);
      card.innerHTML = `
        <div class="level-thumb">${p.art}</div>
        <div class="level-info">
          <div class="name">${p.name}</div>
          <div class="meta">${p.grid}×${p.grid} плиток</div>
          <span class="diff-pill">${p.grid<=3?'Лёгкий':p.grid===4?'Средний':'Сложный'}</span>
        </div>`;
      list.appendChild(card);
    });
  },
  renderCollection(){
    const grid = document.getElementById('collection-grid');
    grid.innerHTML = '';
    PUZZLES.forEach(p=>{
      const done = Progress.isDone(p.id);
      const el = document.createElement('div');
      el.className = 'collection-item' + (done ? '' : ' locked');
      el.innerHTML = done ? p.art : `<svg viewBox="0 0 24 24"><path d="M12 2a5 5 0 00-5 5v3H6a1 1 0 00-1 1v9a1 1 0 001 1h12a1 1 0 001-1v-9a1 1 0 00-1-1h-1V7a5 5 0 00-5-5zm-3 8V7a3 3 0 016 0v3H9z" fill="#5b6b52"/></svg>`;
      grid.appendChild(el);
    });
  },
  openCollection(){ this.goTo('collection'); }
};

/* ---------------------- ИГРОВАЯ ЛОГИКА (сдвиг рядов/столбцов) ---------------------- */
const Game = {
  current:null,
  mode:'picture',
  n:0,            // размер сетки n×n
  cell:0,         // размер плитки в px
  tiles:[],       // массив плиток {origIndex, r, c, el}
  textChunks:[],

  start(id){
    this.current = PUZZLES.find(p=>p.id===id);
    this.mode = 'picture';
    document.getElementById('mode-pic-btn').classList.add('active');
    document.getElementById('mode-text-btn').classList.remove('active');
    document.getElementById('game-title').textContent = this.current.name;
    App.goTo('game');
    this.textChunks = buildTextChunks(this.current);
    this.buildBoard();
  },

  exit(){ App.goTo('levels'); },

  buildBoard(){
    const p = this.current;
    const n = p.grid;
    this.n = n;

    const board = document.getElementById('board');
    const boardOuter = document.getElementById('board-outer');
    board.innerHTML = '';

    const maxSize = Math.min(window.innerWidth - 90, window.innerHeight * 0.5, 320);
    const cell = Math.floor(maxSize / n);
    this.cell = cell;
    board.style.width = (cell*n) + 'px';
    board.style.height = (cell*n) + 'px';
    boardOuter.style.width = (cell*n + 68) + 'px';

    // solved state: tile origIndex i sits at r=Math.floor(i/n), c=i%n
    this.tiles = [];
    for(let i=0;i<n*n;i++){
      this.tiles.push({ origIndex:i, r:Math.floor(i/n), c:i%n });
    }

    // shuffle via random row/column cyclic shifts (always solvable — built by reverse moves)
    for(let k=0;k<n*14;k++){
      if(Math.random()<0.5){
        this.shiftRow(Math.floor(Math.random()*n), Math.random()<0.5?'left':'right', true);
      } else {
        this.shiftCol(Math.floor(Math.random()*n), Math.random()<0.5?'up':'down', true);
      }
    }

    this.renderTiles(true);
    this.renderArrows();
    this.updateProgress();
  },

  renderTiles(instant){
    const board = document.getElementById('board');
    const p = this.current;
    const n = this.n;
    const cell = this.cell;
    const imgUri = svgToDataUri(p.art);

    this.tiles.forEach(t=>{
      let el = t.el;
      if(!el){
        el = document.createElement('div');
        el.className = 'tile';
        el.style.width = cell+'px';
        el.style.height = cell+'px';
        const num = document.createElement('div');
        num.className = 'tile-number';
        num.textContent = t.origIndex+1;
        el.appendChild(num);
        board.appendChild(el);
        t.el = el;
        makeSwipable(el, t, this);
      }
      if(instant){ el.style.transition = 'none'; }
      el.style.left = (t.c*cell)+'px';
      el.style.top = (t.r*cell)+'px';
      if(instant){ requestAnimationFrame(()=>{ el.style.transition=''; }); }

      const origR = Math.floor(t.origIndex/n), origC = t.origIndex%n;
      if(this.mode === 'picture'){
        el.classList.remove('text-mode');
        el.style.backgroundImage = `url("${imgUri}")`;
        el.style.backgroundSize = `${cell*n}px ${cell*n}px`;
        el.style.backgroundPosition = `-${origC*cell}px -${origR*cell}px`;
        el.textContent = '';
        el.appendChild(el.querySelector('.tile-number') || document.createElement('div'));
      } else {
        el.classList.add('text-mode');
        el.style.backgroundImage = 'none';
        el.textContent = this.textChunks[t.origIndex];
        const num = document.createElement('div');
        num.className='tile-number'; num.textContent = t.origIndex+1;
        el.appendChild(num);
      }
    });
  },

  renderArrows(){
    const boardOuter = document.getElementById('board-outer');
    boardOuter.querySelectorAll('.row-arrow, .col-arrow').forEach(a=>a.remove());
    const n = this.n, cell = this.cell;
    for(let r=0;r<n;r++){
      const left = mkArrow('◀', 4, 30 + r*cell + cell/2 - 12, ()=>this.shiftRow(r,'left'));
      const right = mkArrow('▶', 4 + cell*n + 24, 30 + r*cell + cell/2 - 12, ()=>this.shiftRow(r,'right'));
      boardOuter.appendChild(left); boardOuter.appendChild(right);
    }
    for(let c=0;c<n;c++){
      const up = mkArrow('▲', 34 + c*cell + cell/2 - 12, 2, ()=>this.shiftCol(c,'up'));
      const down = mkArrow('▼', 34 + c*cell + cell/2 - 12, 4 + cell*n + 24, ()=>this.shiftCol(c,'down'));
      boardOuter.appendChild(up); boardOuter.appendChild(down);
    }
    function mkArrow(symbol, left, top, onClick){
      const a = document.createElement('div');
      a.className = symbol==='◀'||symbol==='▶' ? 'row-arrow' : 'col-arrow';
      a.textContent = symbol;
      a.style.left = left+'px'; a.style.top = top+'px';
      a.onclick = onClick;
      return a;
    }
  },

  shiftRow(r, dir, silent){
    const n = this.n;
    const rowTiles = this.tiles.filter(t=>t.r===r).sort((a,b)=>a.c-b.c);
    if(dir==='left'){
      const first = rowTiles[0].c;
      rowTiles.forEach((t,i)=>{ t.c = i===rowTiles.length-1 ? first : rowTiles[i+1].c; });
    } else {
      const last = rowTiles[rowTiles.length-1].c;
      for(let i=rowTiles.length-1;i>=0;i--){
        rowTiles[i].c = i===0 ? last : rowTiles[i-1].c;
      }
    }
    if(!silent){ this.renderTiles(false); this.updateProgress(); this.checkComplete(); }
  },

  shiftCol(c, dir, silent){
    const colTiles = this.tiles.filter(t=>t.c===c).sort((a,b)=>a.r-b.r);
    if(dir==='up'){
      const first = colTiles[0].r;
      colTiles.forEach((t,i)=>{ t.r = i===colTiles.length-1 ? first : colTiles[i+1].r; });
    } else {
      const last = colTiles[colTiles.length-1].r;
      for(let i=colTiles.length-1;i>=0;i--){
        colTiles[i].r = i===0 ? last : colTiles[i-1].r;
      }
    }
    if(!silent){ this.renderTiles(false); this.updateProgress(); this.checkComplete(); }
  },

  setMode(mode){
    if(this.mode === mode) return;
    this.mode = mode;
    document.getElementById('mode-pic-btn').classList.toggle('active', mode==='picture');
    document.getElementById('mode-text-btn').classList.toggle('active', mode==='text');
    this.renderTiles(false);
  },

  updateProgress(){
    const n = this.n;
    let correct = 0;
    this.tiles.forEach(t=>{
      const origR = Math.floor(t.origIndex/n), origC = t.origIndex%n;
      if(t.r===origR && t.c===origC) correct++;
    });
    const pct = Math.round((correct/this.tiles.length)*100);
    document.getElementById('progress-bar').style.width = pct+'%';
    return correct === this.tiles.length;
  },

  checkComplete(){
    const n = this.n;
    const done = this.tiles.every(t=>{
      const origR = Math.floor(t.origIndex/n), origC = t.origIndex%n;
      return t.r===origR && t.c===origC;
    });
    if(done){
      Progress.markDone(this.current.id);
      setTimeout(()=>Modal.open(this.current), 300);
    }
  },

  peek(){
    document.getElementById('peek-art').innerHTML = this.current.art;
    document.getElementById('peek-overlay').classList.add('active');
  },
  closePeek(){
    document.getElementById('peek-overlay').classList.remove('active');
  },

  useHint(){
    VK.showRewardedAd(()=>{
      const board = document.getElementById('board');
      board.classList.add('show-hints');
      toast('Вот правильные номера плиток!');
      setTimeout(()=>board.classList.remove('show-hints'), 4000);
    });
  },

  next(){
    Modal.close();
    const idx = PUZZLES.findIndex(p=>p.id===this.current.id);
    const nextPuzzle = PUZZLES[idx+1];
    if(nextPuzzle){ this.start(nextPuzzle.id); }
    else { App.goTo('levels'); }
  },

  share(){
    VK.shareResult('Я собрал(а) пазл «' + this.current.name + '» в игре «Красная Книга: Пазл»!');
  }
};

/* ---------- свайп по плитке: определяет ряд/столбец для сдвига ---------- */
function makeSwipable(el, tile, game){
  el.addEventListener('pointerdown', (e)=>{
    e.preventDefault();
    el.setPointerCapture(e.pointerId);
    const startX = e.clientX, startY = e.clientY;
    let moved = false;

    function onMove(ev){
      const dx = ev.clientX-startX, dy = ev.clientY-startY;
      if(Math.abs(dx) > 6 || Math.abs(dy) > 6) moved = true;
    }
    function onUp(ev){
      el.removeEventListener('pointermove', onMove);
      el.removeEventListener('pointerup', onUp);
      if(!moved) return;
      const dx = ev.clientX-startX, dy = ev.clientY-startY;
      const threshold = 18;
      if(Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > threshold){
        game.shiftRow(tile.r, dx>0 ? 'right' : 'left');
      } else if(Math.abs(dy) > threshold){
        game.shiftCol(tile.c, dy>0 ? 'down' : 'up');
      }
    }
    el.addEventListener('pointermove', onMove);
    el.addEventListener('pointerup', onUp);
  });
}

/* ---------------------- МОДАЛЬНОЕ ОКНО РЕЗУЛЬТАТА ---------------------- */
const Modal = {
  open(p){
    document.getElementById('modal-art').innerHTML = p.art;
    document.getElementById('modal-name').textContent = p.name;
    document.getElementById('modal-latin').textContent = p.latin;
    document.getElementById('modal-status').textContent = p.status;
    const list = document.getElementById('modal-facts');
    list.innerHTML = '';
    p.facts.forEach(f=>{
      const li = document.createElement('li');
      li.textContent = f;
      list.appendChild(li);
    });
    const idx = PUZZLES.findIndex(x=>x.id===p.id);
    document.getElementById('modal-next-btn').style.display = (idx < PUZZLES.length-1) ? 'block' : 'none';
    document.getElementById('modal-result').classList.add('active');
  },
  close(){ document.getElementById('modal-result').classList.remove('active'); }
};

/* ---------------------- СТАРТ ---------------------- */
VK.init();
App.goTo('menu');
</script>
